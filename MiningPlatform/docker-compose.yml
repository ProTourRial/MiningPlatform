name: mining-platform

x-build-metadata: &build-metadata
  MINING_BUILD_VERSION: ${MINING_BUILD_VERSION:-0.3.0-alpha.2}
  GIT_COMMIT: ${GIT_COMMIT:-UNCOMMITTED}
  BUILD_DATE: ${BUILD_DATE:-2026-08-03T04:33:00+07:00}
  SCHEMA_VERSION: ${SCHEMA_VERSION:-8}
  SCHEMA_MIGRATION: ${SCHEMA_MIGRATION:-20260803040000_auth_session_rotation_hardening}


services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PUBLIC_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mining-network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mining-network]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    networks: [mining-network]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *build-metadata
      NODE_ENV: production
      PORT: 4000
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      EVENT_STREAM: ${EVENT_STREAM:-mining:domain-events}
      REALTIME_EVENT_GROUP: ${REALTIME_EVENT_GROUP:-api-realtime-v1}
      ENABLE_DEVELOPMENT_DASHBOARD: "false"
      ENABLE_REALTIME_GATEWAY: ${ENABLE_REALTIME_GATEWAY:-true}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Set AUTH_ENCRYPTION_KEY in .env}
      AUTH_IP_HASH_KEY: ${AUTH_IP_HASH_KEY:?Set AUTH_IP_HASH_KEY in .env}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-mining-platform}
      AUTH_TOKEN_AUDIENCE: ${AUTH_TOKEN_AUDIENCE:-mining-platform-control-plane}
      AUTH_ACCESS_TOKEN_SECONDS: ${AUTH_ACCESS_TOKEN_SECONDS:-900}
      AUTH_REFRESH_TOKEN_DAYS: ${AUTH_REFRESH_TOKEN_DAYS:-30}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-true}
      AUTH_EXPOSE_TEST_TOKENS: "false"
      SUPPORT_PAYMENTS_ENABLED: ${SUPPORT_PAYMENTS_ENABLED:-false}
      ENABLE_SWAGGER: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [mining-network]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SOCKET_URL: ""
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      ENABLE_DEVELOPMENT_DASHBOARD: "false"
    depends_on:
      api: { condition: service_healthy }
    networks: [mining-network]

  stratum-server:
    build:
      context: .
      dockerfile: infrastructure/docker/stratum.Dockerfile
    restart: unless-stopped
    environment:
      <<: *build-metadata
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      EVENT_BUS_DRIVER: redis
      EVENT_STORE_DRIVER: postgres
      EVENT_STREAM: ${EVENT_STREAM:-mining:domain-events}
      STRATUM_HOST: 0.0.0.0
      STRATUM_PORT: 3333
      STRATUM_DEV_MODE: "false"
      STRATUM_AUTH_DRIVER: postgres
      STRATUM_AUTH_MAX_FAILURES: ${STRATUM_AUTH_MAX_FAILURES:-5}
      STRATUM_AUTH_WINDOW_MS: ${STRATUM_AUTH_WINDOW_MS:-60000}
      STRATUM_AUTH_LOCK_MS: ${STRATUM_AUTH_LOCK_MS:-900000}
      STRATUM_IP_HASH_KEY: ${STRATUM_IP_HASH_KEY:?Set STRATUM_IP_HASH_KEY in .env}
      UPSTREAM_DRIVER: ${UPSTREAM_DRIVER:-multi}
      UPSTREAM_HOST: ${UPSTREAM_HOST:-}
      UPSTREAM_PORT: ${UPSTREAM_PORT:-3333}
      UPSTREAM_TLS: ${UPSTREAM_TLS:-false}
      UPSTREAM_SERVER_NAME: ${UPSTREAM_SERVER_NAME:-}
      UPSTREAM_USERNAME: ${UPSTREAM_USERNAME:-}
      UPSTREAM_PASSWORD: ${UPSTREAM_PASSWORD:-}
      UPSTREAM_USER_AGENT: ${UPSTREAM_USER_AGENT:-MiningPlatform/0.3.0-alpha.2}
      UPSTREAM_CONNECT_TIMEOUT_MS: ${UPSTREAM_CONNECT_TIMEOUT_MS:-5000}
      UPSTREAM_RESPONSE_TIMEOUT_MS: ${UPSTREAM_RESPONSE_TIMEOUT_MS:-10000}
      UPSTREAM_MAXIMUM_ATTEMPTS: ${UPSTREAM_MAXIMUM_ATTEMPTS:-5}
      UPSTREAM_POOLS_JSON: ${UPSTREAM_POOLS_JSON:-}
      UPSTREAM_MAXIMUM_RECOVERY_CYCLES: ${UPSTREAM_MAXIMUM_RECOVERY_CYCLES:-5}
      UPSTREAM_RECONNECT_BASE_MS: ${UPSTREAM_RECONNECT_BASE_MS:-250}
      UPSTREAM_RECONNECT_MAXIMUM_MS: ${UPSTREAM_RECONNECT_MAXIMUM_MS:-30000}
      UPSTREAM_RECONNECT_JITTER_RATIO: ${UPSTREAM_RECONNECT_JITTER_RATIO:-0.2}
      UPSTREAM_SHARE_QUEUE_CAPACITY: ${UPSTREAM_SHARE_QUEUE_CAPACITY:-256}
      UPSTREAM_SHARE_QUEUE_TIMEOUT_MS: ${UPSTREAM_SHARE_QUEUE_TIMEOUT_MS:-10000}
      UPSTREAM_JOB_CACHE_MAXIMUM_ENTRIES: ${UPSTREAM_JOB_CACHE_MAXIMUM_ENTRIES:-512}
      VARDIFF_ENABLED: ${VARDIFF_ENABLED:-false}
      VARDIFF_TARGET_SHARE_INTERVAL_SECONDS: ${VARDIFF_TARGET_SHARE_INTERVAL_SECONDS:-15}
      VARDIFF_RETARGET_INTERVAL_SECONDS: ${VARDIFF_RETARGET_INTERVAL_SECONDS:-90}
      VARDIFF_MINIMUM_DIFFICULTY: ${VARDIFF_MINIMUM_DIFFICULTY:-1}
      VARDIFF_MAXIMUM_DIFFICULTY: ${VARDIFF_MAXIMUM_DIFFICULTY:-1000000000}
      VARDIFF_MAXIMUM_ADJUSTMENT_FACTOR: ${VARDIFF_MAXIMUM_ADJUSTMENT_FACTOR:-4}
      VARDIFF_MINIMUM_SAMPLES: ${VARDIFF_MINIMUM_SAMPLES:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${STRATUM_PUBLISH_ADDRESS:-127.0.0.1}:${STRATUM_PUBLIC_PORT:-3333}:3333"
    volumes:
      - stratum_data:/app/data/stratum
    networks: [mining-network]

  outbox-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/outbox-worker.Dockerfile
    restart: unless-stopped
    environment:
      <<: *build-metadata
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      EVENT_STREAM: ${EVENT_STREAM:-mining:domain-events}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-500}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      OUTBOX_LOCK_TIMEOUT_MS: ${OUTBOX_LOCK_TIMEOUT_MS:-60000}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Set AUTH_ENCRYPTION_KEY in .env}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mining-network]

  mining-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/mining-worker.Dockerfile
    restart: unless-stopped
    environment:
      <<: *build-metadata
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      EVENT_STREAM: ${EVENT_STREAM:-mining:domain-events}
      MINING_EVENT_GROUP: ${MINING_EVENT_GROUP:-mining-projection-v1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      outbox-worker: { condition: service_started }
    networks: [mining-network]

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/scheduler.Dockerfile
    restart: unless-stopped
    environment:
      <<: *build-metadata
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-3600000}
      HASHRATE_BUCKET_RETENTION_DAYS: ${HASHRATE_BUCKET_RETENTION_DAYS:-7}
      HASHRATE_SNAPSHOT_RETENTION_DAYS: ${HASHRATE_SNAPSHOT_RETENTION_DAYS:-90}
      OUTBOX_PUBLISHED_RETENTION_DAYS: ${OUTBOX_PUBLISHED_RETENTION_DAYS:-7}
      IDEMPOTENCY_RETENTION_DAYS: ${IDEMPOTENCY_RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [mining-network]

  wallet-worker:
    profiles: ["wallet"]
    build:
      context: .
      dockerfile: infrastructure/docker/wallet-worker.Dockerfile
    restart: unless-stopped
    environment:
      <<: *build-metadata
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      BITCOIN_RPC_URL: ${BITCOIN_RPC_URL:?Set BITCOIN_RPC_URL in .env}
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER:?Set BITCOIN_RPC_USER in .env}
      BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:?Set BITCOIN_RPC_PASSWORD in .env}
      BITCOIN_WALLET_NAME: ${BITCOIN_WALLET_NAME:?Set BITCOIN_WALLET_NAME in .env}
      PAYOUTS_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mining-network]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks: [mining-network]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [mining-network]

  nginx:
    image: nginx:1.29.8-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_started }
      api: { condition: service_healthy }
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [mining-network]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
  stratum_data:

networks:
  mining-network:
    driver: bridge
