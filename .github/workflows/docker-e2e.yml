name: Docker E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "MiningPlatform/.env.ci.example"
      - "MiningPlatform/docker-compose.yml"
      - "MiningPlatform/infrastructure/docker/**"
      - "MiningPlatform/apps/**"
      - "MiningPlatform/packages/**"
      - ".github/workflows/docker-e2e.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: MiningPlatform

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: MiningPlatform/pnpm-lock.yaml
      - name: Validate isolated E2E environment
        run: docker compose --env-file .env.ci.example config --quiet
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Start dependencies
        run: docker compose --env-file .env.ci.example up -d --wait --wait-timeout 120 postgres redis
      - name: Apply database migrations
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://mining:change-me-postgres@127.0.0.1:5432/mining_platform?schema=public
      - name: Build and start application services
        run: docker compose --env-file .env.ci.example up -d --build api web nginx
      - name: Wait for API readiness
        run: node scripts/wait-for-http.mjs http://127.0.0.1/api/v1/health/ready 180000
      - name: Verify public endpoints
        run: |
          curl --fail --silent http://127.0.0.1/version
          curl --fail --silent http://127.0.0.1/api/v1/wallets/status
      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env.ci.example logs --no-color
      - name: Stop environment
        if: always()
        run: docker compose --env-file .env.ci.example down -v --remove-orphans
